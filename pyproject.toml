[project]
name = "geospatial-file-measurement-api"
version = "1.0.0"
description = "FastAPI service that extracts features from Shapefile/KML uploads and measures them."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py311"
